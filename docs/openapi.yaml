openapi: 3.0.3
info:
  title: Сервис оценки получателя перевода
  version: 0.1.0
  description: |
    Банк вызывает `POST /score` перед отправкой перевода и получает риск получателя,
    причины на понятном языке и рекомендацию: пропустить, предупредить клиента или приостановить перевод.
    Каждый такой перевод становится алертом в очереди антифрод-аналитика (`GET /alerts`), а счёт
    получателя попадает в выгрузку `GET /flagged` (JSON) и `GET /flagged.csv` (файл).

    Расследование сети (`/graph/*`) строит граф связей вокруг подозрительного счёта по данным,
    которые у банка уже есть, и объясняет каждую найденную связь.

    Сервис считает оценку локально и не обращается к внешним системам.
servers:
  - url: http://127.0.0.1:8787
    description: Локальный запуск (npm run service)
security:
  - ApiKey: []
  - {}
paths:
  /score:
    post:
      summary: Оценить получателя перевода
      operationId: score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
            example:
              transfer_id: tr_20261112_000123
              lang: ru
              recipient:
                account_id: tok_02d9fc
                account_age_days: 4
                unrelated_senders_7d: 8
                fast_outflow_share_7d: 0.92
                shared_device_accounts: 3
              context:
                amount: 450000
                sender_on_call: true
                remote_access_active: false
                first_transfer_to_recipient: true
                amount_to_typical_ratio: 18
      responses:
        '200':
          description: Оценка и рекомендация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
              example:
                request_id: 0b1f5a52-6f0e-4c58-9f1c-0f6a3f1f2a77
                transfer_id: tr_20261112_000123
                risk: 0.9998
                risk_level: high
                action: hold
                reasons:
                  - code: FAST_OUTFLOW
                    text: 92% поступлений уходит со счёта в течение часа
                    contribution: 4.98
                  - code: NEW_ACCOUNT
                    text: Счёт получателя открыт 4 дн. назад
                    contribution: 3.4
                  - code: ON_CALL
                    text: Клиент во время перевода разговаривает по телефону
                    contribution: null
                client_message:
                  title: Перевод приостановлен на проверку
                  body: Перевод похож на мошенническую схему. Деньги остались на вашем счёте.
                contributions:
                  account_age_days: 3.4
                  unrelated_senders_7d: 1.61
                  fast_outflow_share_7d: 4.98
                  shared_device_accounts: 2.32
                missing_features: []
                model_version: lgbm-monotone-synthetic-20261112
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /alerts:
    get:
      summary: Очередь алертов для антифрод-аналитика
      description: |
        Алерт создаётся в момент ответа на `POST /score` с рекомендацией `warn` или `hold`.
        Сначала идут алерты высокого приоритета, внутри приоритета — новые сверху.
        Если сервис запущен с `ALERT_WEBHOOK_URL`, тот же объект сразу отправляется туда запросом POST.
      operationId: listAlerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, in_progress, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, medium]
        - $ref: '#/components/parameters/since'
      responses:
        '200':
          description: Алерты
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /alerts/{alert_id}:
    patch:
      summary: Взять алерт в работу или закрыть с итогом разбора
      operationId: updateAlert
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, in_progress, closed]
                resolution:
                  type: string
                  enum: [fraud, legit]
                  description: Итог разбора; учитывается только при status = closed.
            example:
              status: closed
              resolution: fraud
      responses:
        '200':
          description: Обновлённый алерт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Алерт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /flagged:
    get:
      summary: Помеченные счета для аналитика (JSON)
      operationId: listFlagged
      parameters:
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/min_risk'
        - $ref: '#/components/parameters/action'
      responses:
        '200':
          description: Счета, отсортированные по убыванию риска
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlaggedAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /flagged.csv:
    get:
      summary: Помеченные счета для аналитика (CSV-файл)
      description: |
        Те же данные, что в `GET /flagged`, в кодировке UTF-8 с BOM. Колонки: account_id, max_risk,
        last_action, flagged_transfers, flagged_amount, first_flagged_at, last_flagged_at, reason_codes,
        reasons, account_age_days, unrelated_senders_7d, fast_outflow_share_7d, shared_device_accounts,
        model_version.
      operationId: exportFlaggedCsv
      parameters:
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/min_risk'
        - $ref: '#/components/parameters/action'
        - name: separator
          in: query
          description: Разделитель колонок. `semicolon` — для Excel с русскими региональными настройками.
          schema:
            type: string
            enum: [comma, semicolon]
            default: comma
      responses:
        '200':
          description: CSV-файл
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /graph/cases:
    get:
      summary: Что передано на расследование сети
      description: |
        Сигналы основного антифрода банка и открытые алерты сервиса оценки, по счёту которых есть
        данные для графа. Высокий приоритет сверху.
      operationId: graphCases
      responses:
        '200':
          description: Список сигналов
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncomingCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /graph/investigate:
    post:
      summary: Построить сеть связей вокруг счёта, клиента, перевода или алерта
      description: |
        Модуль собирает клиентов, счета, карты, устройства, IP-адреса и телефоны вокруг исходной
        сущности на `depth` уровней (владелец счёта и его карта — та же сторона, уровень не тратят),
        оценивает роль каждого счёта по прозрачным правилам и возвращает находки: транзитные счета,
        сборщиков, общие идентификаторы, повторяющиеся схемы, центральные узлы, вероятно пострадавших,
        путь до подтверждённых дел и денежные маршруты.

        Модуль не объявляет клиента мошенником: у каждого вывода есть объяснение, источник данных и
        уверенность (не выше 0,9; 0,95 — только у решений банка по делам). Решает сотрудник.
      operationId: investigate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigateRequest'
            example:
              alert_id: AF-77105
              depth: 2
              links: [transfer, device, phone, ip, card]
      responses:
        '200':
          description: Граф и находки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: В данных банка нет такого счёта, клиента, перевода или алерта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /graph/entities/{id}:
    get:
      summary: Карточка узла графа
      description: Роль с объяснением, отметки антифрода, финансовая активность за период, связи и история переводов (до 200 последних).
      operationId: graphEntity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: min_amount
          in: query
          schema:
            type: number
        - name: links
          in: query
          description: Типы связей через запятую, по умолчанию все.
          schema:
            type: string
            example: transfer,device,phone
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /graph/search:
    get:
      summary: Поиск по имени, псевдониму счёта, устройству или номеру перевода
      operationId: graphSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: До 20 совпадений и перевод, если q — его номер
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        label:
                          type: string
                  transfer:
                    type: object
                    nullable: true
  /incoming:
    post:
      summary: Проверить поступление на счёт клиента банка (сторона получателя)
      description: |
        Банк вызывает, когда на счёт его клиента приходит перевод — из этого же банка или из другого.
        Против схемы «треугольник»: обманутый покупатель платит «за товар» честному продавцу
        криптовалюты, и тот отпускает криптовалюту мошеннику. Модуль предупреждает продавца до этого.

        - `hold_credit` — приостановить зачисление: банк отправителя сообщил о мошенничестве через
          Антифрод-центр Национального банка (`antifraud_center.flagged`).
        - `notify` — зачислить и предупредить получателя: назначение «товар или услуга», а получатель
          продаёт криптовалюту; или отправитель был на звонке.
        - `none` — ничего не делать.

        Для `notify` и `hold_credit` создаётся алерт в очереди `GET /alerts`.
      operationId: incoming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, recipient, sender]
              properties:
                transfer_id:
                  type: string
                lang:
                  type: string
                  enum: [ru, kk, en]
                  default: ru
                amount:
                  type: number
                recipient:
                  type: object
                  required: [account_id]
                  properties:
                    account_id:
                      type: string
                    client_ref:
                      type: string
                    p2p_trader_profile:
                      type: boolean
                      nullable: true
                sender:
                  type: object
                  required: [bank]
                  properties:
                    bank:
                      type: string
                      enum: [same, other]
                    display_name:
                      type: string
                      description: Имя, как его показывает банк («Алмас Т.»), — получатель сверит его с покупателем на площадке.
                    first_transfer_to_recipient:
                      type: boolean
                      nullable: true
                    payment_purpose:
                      type: string
                      nullable: true
                      enum: [family, goods, services, crypto_p2p, other]
                    on_call:
                      type: boolean
                      nullable: true
                antifraud_center:
                  type: object
                  nullable: true
                  description: Отметка Антифрод-центра Национального банка по этому переводу.
                  properties:
                    flagged:
                      type: boolean
                    ref:
                      type: string
                    reason:
                      type: string
            example:
              amount: 185000
              recipient: { account_id: tok_p2p771, p2p_trader_profile: true }
              sender: { bank: other, display_name: Алмас Т., first_transfer_to_recipient: true, payment_purpose: goods }
      responses:
        '200':
          description: Решение для зачисления и текст уведомления получателю
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer_id:
                    type: string
                    nullable: true
                  action:
                    type: string
                    enum: [none, notify, hold_credit]
                  reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum: [ANTIFRAUD_CENTER, TRIANGLE, SENDER_ON_CALL]
                        text:
                          type: string
                  recipient_message:
                    type: object
                    nullable: true
                    properties:
                      title:
                        type: string
                      body:
                        type: string
                  alert_id:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      summary: Проверка, что сервис работает
      operationId: health
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  model_version:
                    type: string
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Обязателен, если сервис запущен с переменной SCORE_API_KEY.
  parameters:
    since:
      name: since
      in: query
      description: Только счета, помеченные не раньше этого момента (ISO 8601, UTC).
      schema:
        type: string
        format: date-time
    min_risk:
      name: min_risk
      in: query
      description: Только счета с риском не ниже указанного.
      schema:
        type: number
        minimum: 0
        maximum: 1
    action:
      name: action
      in: query
      description: Только счета с такой последней рекомендацией.
      schema:
        type: string
        enum: [warn, hold]
  responses:
    InvalidRequest:
      description: Запрос не прошёл проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет или неверный X-API-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ScoreRequest:
      type: object
      required: [recipient, context]
      properties:
        transfer_id:
          type: string
          maxLength: 100
          description: Идентификатор перевода в системе банка; возвращается в ответе без изменений. Повторный запрос с тем же идентификатором не создаёт второй алерт.
        client_ref:
          type: string
          maxLength: 100
          description: Псевдоним клиента-отправителя. Попадает в алерт, чтобы система банка подставила контакты клиента. ФИО и телефон сервису не передаются.
        lang:
          type: string
          enum: [ru, kk, en]
          default: ru
          description: Язык текстов причин и предупреждения.
        recipient:
          $ref: '#/components/schemas/Recipient'
        context:
          $ref: '#/components/schemas/Context'
    Recipient:
      type: object
      required: [account_id]
      description: Признаки счёта получателя. Любой признак можно не передавать или передать null — он не повлияет на оценку.
      properties:
        account_id:
          type: string
          maxLength: 100
          description: Псевдоним счёта (токен или хеш), по которому банк узнаёт счёт. Номер счёта, ИИН и ФИО не нужны.
        account_age_days:
          type: number
          nullable: true
          minimum: 0
          description: Сколько дней назад открыт счёт.
        unrelated_senders_7d:
          type: number
          nullable: true
          minimum: 0
          description: Сколько разных отправителей, у которых раньше не было переводов этому получателю, прислали деньги за последние 7 дней.
        fast_outflow_share_7d:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Доля поступлений за последние 7 дней, которая ушла со счёта (перевод, снятие) в течение часа после зачисления.
        shared_device_accounts:
          type: number
          nullable: true
          minimum: 0
          description: В сколько других счетов входили с тех же устройств, что и в этот счёт.
        idle_days_before_inflow:
          type: number
          nullable: true
          minimum: 0
          description: |
            Дополнительный сигнал. Сколько дней подряд на счёте не было операций перед поступлениями последних
            7 дней. Долгое молчание, а потом поток денег — примета купленного или «спящего» счёта.
        new_device_7d:
          type: integer
          nullable: true
          enum: [0, 1]
          description: Дополнительный сигнал. 1 — за 7 дней в счёт входили с нового для него устройства.
        flagged_linked_senders_7d:
          type: number
          nullable: true
          minimum: 0
          description: |
            Дополнительный сигнал (связи в графе переводов). Сколько незнакомых отправителей за 7 дней платили
            и на счета, которые банк уже заблокировал или пометил как мошеннические.
        p2p_trader_profile:
          type: boolean
          nullable: true
          default: null
          description: |
            Банк по своим данным видит, что получатель продаёт криптовалюту на P2P-площадках (много
            разовых плательщиков с назначением «криптовалюта», деньги уходят на биржу). Нужен для правила
            «треугольник». В оценку счёта не входит.
    Context:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Сумма перевода.
        sender_on_call:
          type: boolean
          nullable: true
          default: null
          description: Клиент во время перевода на звонке (сигнал клиентского модуля). null — модуль не подключён.
        remote_access_active:
          type: boolean
          nullable: true
          default: null
          description: На телефоне клиента включён удалённый доступ к экрану (AnyDesk и подобные) — сигнал клиентского модуля. null — не проверялось.
        first_transfer_to_recipient:
          type: boolean
          nullable: true
          default: null
          description: |
            true — клиент раньше не переводил этому получателю; false — уже переводил (тогда решение
            по признакам счёта смягчается на ступень); null — банк не сообщил, смягчения нет.
        amount_to_typical_ratio:
          type: number
          nullable: true
          minimum: 0
          default: null
          description: Сумма перевода, делённая на обычный перевод этого клиента (например, медиану за 90 дней).
        payment_purpose:
          type: string
          nullable: true
          default: null
          enum: [family, goods, services, crypto_p2p, other]
          description: |
            За что клиент платит, по его словам (банк спрашивает в приложении). Оплата товара или услуги
            новому получателю с `p2p_trader_profile: true` — схема «треугольник»: сервис предупреждает
            клиента (код причины TRIANGLE). null — банк не спрашивал, правило не срабатывает.
    ScoreResponse:
      type: object
      required: [request_id, risk, risk_level, mode, action, recommended_action, reasons, client_message, contributions, missing_features, model_version]
      properties:
        request_id:
          type: string
          format: uuid
        transfer_id:
          type: string
          nullable: true
        risk:
          type: number
          minimum: 0
          maximum: 1
          description: Оценка риска получателя. Это оценка для сравнения с порогами, а не вероятность.
        risk_level:
          type: string
          enum: [low, medium, high]
        mode:
          type: string
          enum: [enforce, shadow]
          description: shadow — теневой режим пилота (сервис запущен с SHADOW=1).
        action:
          type: string
          enum: [allow, warn, hold]
          description: |
            Рекомендация — пропустить, предупредить клиента, приостановить перевод. Решение остаётся за банком.
            В теневом режиме всегда allow, чтобы пилот ничего не менял в переводах.
        recommended_action:
          type: string
          enum: [allow, warn, hold]
          description: Что сервис рекомендовал бы на самом деле. Вне теневого режима совпадает с action.
        alert_id:
          type: string
          nullable: true
          description: Идентификатор алерта в очереди аналитика; null при action = allow.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
        client_message:
          type: object
          nullable: true
          description: Текст предупреждения для клиента; null при action = allow.
          required: [title, body]
          properties:
            title:
              type: string
            body:
              type: string
        contributions:
          type: object
          description: Вклад каждого признака получателя в оценку (в единицах логита) — значение Шепли (SHAP). Больше нуля — поднял риск. Вклады в сумме дают «оценка счёта минус средняя оценка»; у непереданного признака вклад ноль.
          additionalProperties:
            type: number
        transfer:
          type: object
          nullable: true
          description: |
            Оценка перевода целиком (вторая ступень, логистическая регрессия) в единицах логита и её слагаемые.
            Решение — сравнение score с порогами модели; правила поверх (подтверждённое мошенничество, счёт-мишень,
            «треугольник», удалённый доступ) могут поднять его. null — в модели нет второй ступени, решают правила.
          required: [score, parts]
          properties:
            score:
              type: number
            parts:
              type: object
              required: [account, call, first, amount]
              properties:
                account:
                  type: number
                  description: Вклад оценки счёта получателя.
                call:
                  type: number
                  description: Звонок или удалённый доступ (больше нуля), их нет (меньше нуля), неизвестно (ноль).
                first:
                  type: number
                  description: Новый получатель (больше нуля), клиент уже переводил ему (меньше нуля), неизвестно (ноль).
                amount:
                  type: number
                  description: Сумма относительно обычной для клиента; сумма меньше обычной риск не снижает.
        missing_features:
          type: array
          description: Признаки, которые не были переданы.
          items:
            type: string
        model_version:
          type: string
    Reason:
      type: object
      required: [code, text, contribution]
      properties:
        code:
          type: string
          enum: [NEW_ACCOUNT, MANY_UNRELATED_SENDERS, FAST_OUTFLOW, SHARED_DEVICE, IDLE_THEN_ACTIVE, NEW_DEVICE, LINKED_SENDERS, CONFIRMED_FRAUD, REPEAT_TARGET, REMOTE_ACCESS, ON_CALL, FIRST_TRANSFER, UNUSUAL_AMOUNT, TRIANGLE]
        text:
          type: string
          description: Причина на языке из поля lang.
        contribution:
          type: number
          nullable: true
          description: Вклад в оценку; null у причин, связанных с обстоятельствами перевода.
    Alert:
      type: object
      properties:
        alert_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        priority:
          type: string
          enum: [high, medium]
          description: high — перевод приостановлен или на телефоне клиента включён удалённый доступ.
        status:
          type: string
          enum: [new, in_progress, closed]
        resolution:
          type: string
          nullable: true
          enum: [fraud, legit]
        transfer_id:
          type: string
          nullable: true
        client_ref:
          type: string
          nullable: true
          description: Псевдоним клиента из запроса; контакты по нему подставляет система банка.
        account_id:
          type: string
          description: Псевдоним счёта получателя.
        amount:
          type: number
        action:
          type: string
          enum: [warn, hold]
        risk:
          type: number
        triggers:
          type: array
          description: Сработавшие триггеры — те же причины, что в ответе POST /score.
          items:
            type: object
            properties:
              code:
                type: string
              text:
                type: string
        signals:
          type: object
          description: Что сообщил телефон клиента в момент перевода. null — сигнал не передан.
          properties:
            on_call:
              type: boolean
              nullable: true
              description: Клиент разговаривал по телефону.
            remote_access:
              type: boolean
              nullable: true
              description: На телефоне был включён удалённый доступ к экрану.
            first_transfer:
              type: boolean
              nullable: true
              description: Клиент переводил этому получателю впервые.
            purpose:
              type: string
              nullable: true
              enum: [family, goods, services, crypto_p2p, other]
              description: Назначение платежа, которое указал клиент.
        model_version:
          type: string
    FlaggedAccount:
      type: object
      properties:
        account_id:
          type: string
        max_risk:
          type: number
        last_action:
          type: string
          enum: [warn, hold]
        flagged_transfers:
          type: integer
          description: Сколько переводов на этот счёт получили рекомендацию warn или hold.
        flagged_amount:
          type: number
          description: Сумма этих переводов.
        first_flagged_at:
          type: string
          format: date-time
        last_flagged_at:
          type: string
          format: date-time
        reason_codes:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string
        features:
          type: object
          description: Признаки счёта из последнего помеченного запроса.
          additionalProperties:
            type: number
            nullable: true
        model_version:
          type: string
    IncomingCase:
      type: object
      properties:
        ref:
          type: string
          description: Номер алерта (al_…) или сигнала основного антифрода (AF-…)
        source:
          type: string
          enum: [alert_queue, antifraud_engine, antifraud_center]
        entity_id:
          type: string
        transfer_id:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
        at:
          type: string
          format: date-time
        priority:
          type: string
          enum: [high, medium]
        summary:
          type: string
    InvestigateRequest:
      type: object
      description: Нужен один из entity_id, transfer_id, alert_id.
      properties:
        entity_id:
          type: string
          description: Счёт, клиент, карта, устройство, IP-адрес или телефон
        transfer_id:
          type: string
          description: Перевод; центр графа — счёт получателя, маршрут перевода показывается первым
        alert_id:
          type: string
          description: Алерт очереди сервиса или сигнал основного антифрода
        depth:
          type: integer
          minimum: 1
          maximum: 4
          default: 2
        links:
          type: array
          description: Какие связи учитывать. Владение счётом учитывается всегда.
          items:
            type: string
            enum: [transfer, device, ip, phone, card]
        expand:
          type: array
          description: Узлы, раскрытые сотрудником ещё на уровень
          items:
            type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        min_amount:
          type: number
          description: Учитывать только переводы от этой суммы
    Confidence:
      type: object
      properties:
        value:
          type: number
          minimum: 0
          maximum: 1
        level:
          type: string
          enum: [low, medium, high]
    Assessment:
      type: object
      properties:
        role:
          type: string
          enum: [confirmed_fraud, possible_collector, possible_dropper, p2p_intermediary, possible_victim, busy_legit, regular]
        label:
          type: string
        confidence:
          $ref: '#/components/schemas/Confidence'
        evidence:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              source:
                type: string
                description: Откуда взяты данные — платежи, журнал устройств, решения по делам, алерты антифрода
        caveat:
          type: string
          nullable: true
    Finding:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [confirmed_link, triangle, collector, repeated_pattern, transit, shared_identifier, victims, central_node, not_suspicious]
        title:
          type: string
        explanation:
          type: string
        confidence:
          $ref: '#/components/schemas/Confidence'
        sources:
          type: array
          items:
            type: string
        node_ids:
          type: array
          items:
            type: string
        edge_ids:
          type: array
          items:
            type: string
    Investigation:
      type: object
      properties:
        root:
          type: string
        generated_at:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [client, account, card, device, ip, phone]
              label:
                type: string
              level:
                type: integer
              external:
                type: string
                nullable: true
                enum: [other_bank, exchange, cash]
              assessment:
                allOf:
                  - $ref: '#/components/schemas/Assessment'
                nullable: true
              centrality:
                type: number
                description: Посредничество внутри построенного графа, 0–1
              capped:
                type: boolean
                description: Слишком много связей (общий Wi-Fi, крупный продавец) — узел не раскрывается
        edges:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [transfer, owns, card, device, ip, phone]
              source:
                type: string
              target:
                type: string
              total:
                type: number
              transfers:
                type: array
                items:
                  type: object
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        fraud_paths:
          type: array
          items:
            type: object
        routes:
          type: array
          description: Денежные маршруты — каждый следующий перевод в течение суток после предыдущего
          items:
            type: object
        truncated:
          type: boolean
        disclaimer:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, unauthorized, not_found, internal_error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
